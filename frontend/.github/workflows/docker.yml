name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

    ci: 
        name: CI
        runs-on: ubuntu-latest #runner
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        # -----------------------
        # Login to Docker Hub 
        # -----------------------
        - name: Login to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # -----------------------
        # Build & Push Backend Docker Image
        # -----------------------
        - name: Build and Push Backend Docker Image
          run: |
            docker build -t \
            ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-backend:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-backend:v${{ github.run_number }} \
            ./backend
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-backend:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-backend:v${{ github.run_number }}

        # -----------------------
        # Build & Push Frontend Docker Image
        # -----------------------
        - name: Build & Push Frontend Docker Image
          run: |
                docker build -t \
                ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-frontend:latest \
                ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-frontend:v${{ github.run_number }} \
                ./frontend
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-frontend:latest
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-dashboard-frontend:v${{ github.run_number }}

    cd: 
        name: CD
        runs-on: ubuntu-latest #runner
        
        needs: ci # This job will only run if the CI job is successful
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v3

        # -----------------------
        # Login to Docker Hub 
        # -----------------------
        - name: Login to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # -----------------------
        # Deploy to Kubernetes Cluster
