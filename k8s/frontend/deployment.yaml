apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: user-portal

spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    
    spec:
      containers:
      - name: frontend
        image: sidpram/user-dashboard-frontend:latest
        
        ports:
        - containerPort: 80
