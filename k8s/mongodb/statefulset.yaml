apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: mongodb
  namespace: user-portal

spec:
  serviceName: mongodb

  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
      - name: mongodb-container
        image: mongo:6.0

        ports:
        - containerPort: 27017

        volumeMounts:
        - name: database-volume
          mountPath: /data/db

      volumes:
      - name: database-volume
        persistentVolumeClaim:
          claimName: mongodb-pvc